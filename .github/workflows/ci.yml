name: SheetSense AI CI & Safety Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Formatting and linting
        run: |
          ruff format --check .
          ruff check .

      - name: Type checking
        run: mypy

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Static Write Isolation Check (Guardrail Enforcer)
        run: |
          python scripts/check_write_isolation.py

      - name: Run Unit & Regression Test Suite
        run: |
          pytest tests/ -v --cov=. --cov-branch --cov-report=xml --cov-report=json
          python scripts/check_coverage.py

      - name: Evaluation regression comparison
        run: python scripts/check_eval_regression.py

      - name: Browser and accessibility tests
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Build production container
        run: |
          docker build --tag sheetsense-ai:${{ github.sha }} .

      - name: Boot container and smoke test
        run: |
          docker run -d --name sheetsense-smoke -p 8000:8000 \
            -e APP_ENV=development -e ENV=local_no_redis \
            sheetsense-ai:${{ github.sha }}
          for i in {1..20}; do
            curl --fail http://127.0.0.1:8000/health/live && break
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health/live

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: sheetsense-ai:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-evidence
          path: |
            coverage.xml
            sbom.spdx.json
