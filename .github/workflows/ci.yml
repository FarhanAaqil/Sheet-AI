name: SheetSense AI CI & Safety Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Static Write Isolation Check (Guardrail Enforcer)
        run: |
          python scripts/check_write_isolation.py

      - name: Run Unit & Regression Test Suite
        run: |
          pytest tests/ -v

      - name: Build production container
        run: |
          docker build --tag sheetsense-ai:ci .
