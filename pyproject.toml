[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetsense-ai"
version = "1.0.0"
description = "Conversational AI Agent over Live Google Sheets with RAG-Fusion, Isolated Writes, and Confirmation Gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SheetSense AI Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "langchain>=1.4.6,<2.0.0",
    "langchain-core>=1.3.3,<2.0.0",
    "langchain-google-genai>=4.4.2,<5.0.0",
    "langgraph>=1.2.16,<2.0.0",
    "google-auth>=2.20.0,<3.0.0",
    "google-auth-oauthlib>=1.0.0,<2.0.0",
    "gspread>=5.7.0,<7.0.0",
    "protobuf>=6.33.5,<7.0.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.25.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "tabulate>=0.9.0,<1.0.0",
    "redis>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "playwright>=1.48.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--strict-markers"
markers = [
    "integration: external-service or multi-component integration test",
    "browser: Playwright browser workflow",
    "live: paid/networked real-agent evaluation"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"eval_harness.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
follow_imports = "skip"
files = [
    "config.py",
    "domain_errors.py",
    "evaluation_service.py",
    "observability.py",
    "request_context.py"
]

[tool.coverage.run]
branch = true
omit = [
    "app.py",
    "tests/*",
    "scripts/*"
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod"
]
